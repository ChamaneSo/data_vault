[package]
name = "datavault-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes-gcm = "0.10"
anyhow.workspace = true
async-trait = "0.1"
async-stream = "0.3"
crc32fast = "1"
crc = "3.3"
dotenvy = "0.15"
sync_wrapper = { version = "1", features = ["futures"] }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
base64.workspace = true
chrono.workspace = true
datavault-core = { path = "../../crates/core" }
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
md-5 = "0.10"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring","std","tls12"] }
s3s = "=0.17.0"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls","postgres","uuid","chrono","json","macros","migrate"] }
subtle = "2"
tokio.workspace = true
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter","json"] }
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
